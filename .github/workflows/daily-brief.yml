name: Daily Brief

on:
  schedule:
    # 12:30 UTC = 18:00 IST, weekdays. GitHub cron is UTC-only; there is no
    # timezone field, so this drifts by an hour relative to any DST market.
    - cron: '30 12 * * 1-5'
  workflow_dispatch:        # manual trigger - you will need this for testing

permissions:
  contents: write           # required to commit results back to the repo

concurrency:
  group: daily-brief
  cancel-in-progress: false # never let two runs write the DB at once

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot current output
        # If the pipeline fails mid-run we restore this, so the live site keeps
        # serving the last good brief instead of a half-written or empty one.
        run: |
          mkdir -p public
          cp -r public /tmp/public_backup || true

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.cli refresh --skip-workbook --web

      - name: Restore last good output on failure
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::warning::Pipeline failed - restoring previous brief"
          rm -rf public
          cp -r /tmp/public_backup public

      - name: Run tests
        run: pytest -q

      - name: Commit results
        run: |
          git config user.name  "deskbrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ data/deskbrief.db
          git diff --staged --quiet || git commit -m "brief: $(date -u +%Y-%m-%d)"
          git push

      - name: Fail the run if the pipeline failed
        # Committing the restored output first, then failing, means you get the
        # red X in your inbox but the site never breaks.
        if: steps.pipeline.outcome == 'failure'
        run: exit 1
